name: 腾讯日常跑批配置验证（只读·输出到/tmp·不提交）

# 2026-11-20：验证今晚对 breadth_lib.py 的 EM_HTTP_LIB 可选模式改动未影响腾讯默认链路。
# 只跑 --limit 30 小样本到 /tmp，绝不覆盖 breadth/data/ 生产数据。
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 安装依赖
        run: pip install -r requirements.txt pyyaml

      - name: 验证默认源配置(不设EM_HTTP_LIB)
        env:
          BREADTH_SOURCE: tencent
        run: |
          python3 - <<'PY'
          import os,sys
          os.environ.pop('EM_HTTP_LIB',None)
          sys.path.insert(0,'tools')
          import breadth_lib as b
          print('【配置验证】EM_HTTP_LIB未设 → _USING_OPENSSL =',b._USING_OPENSSL,'(期望False=仍curl_cffi原链路)')
          import breadth_run as r
          print('【配置验证】breadth_run.SRC =',r.SRC,'(期望tencent)')
          import tx_lib
          print('【配置验证】tx_lib 导入OK')
          assert b._USING_OPENSSL is False, '默认仍应curl_cffi'
          assert r.SRC=='tencent', '默认源应为tencent'
          print('【结论】腾讯默认链路配置未受今晚改动影响')
          PY

      - name: 腾讯小样本实跑(30只→/tmp，不碰生产数据)
        env:
          BREADTH_SOURCE: tencent
          BREADTH_WORKERS: '8'
        run: |
          set -uo pipefail
          cp breadth/data/breadth.json /tmp/breadth_verify.json
          T0=$(date +%s)
          timeout 180 python tools/breadth_run.py --out /tmp/breadth_verify.json --limit 30
          RC=$?
          T1=$(date +%s)
          echo ">>> 小样本退出码=$RC 耗时=$((T1-T0))s"
          python3 - <<'PY'
          import json
          d=json.load(open('/tmp/breadth_verify.json',encoding='utf-8'));m=d.get('meta',{})
          print('【实跑结果】source=%s stale=%s universe=%s 交易日=%s 末日=%s'%(
            m.get('source'),m.get('stale'),m.get('universe'),len(d.get('dates',[])),(d.get('dates') or [None])[-1]))
          print('【注意】输出在 /tmp，breadth/data/ 生产数据未被触碰')
          PY

      - name: 确认生产数据文件未被改动
        run: |
          git status --porcelain -- breadth/data/ || echo "【确认】breadth/data/ 无改动"
