name: Groq能力探测+三层容灾验证(仅GHA·一次性)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 探测
        env:
          GROQ_KEY: ${{ secrets.GROQ_KEY }}
        run: timeout 600 python3 tools/groq_probe.py 2>&1 | tee groq.log
