name: 赚钱效应指标收盘跑批

# 触发方式（v2，2026-11-10 定稿）：**只有 Cloudflare Worker 的 Cron Trigger 驱动**
#   CF Cron（云端独立时钟）→ POST workflow_dispatch → 本工作流跑批。
#
# 为什么彻底删掉 GitHub 自带的 schedule：
#   1) 实测本账号的 schedule 通道**整条不生效** —— 2026-11-09/10 建的三个仓库、
#      四个 workflow（含探针）全部 0 次触发；配置、分支、cron 语法都正确，
#      手动 dispatch 全 success。这不是「延迟」，是账号级不触发。
#   2) 依赖一个不报错的定时器比没有定时器更危险：它让人以为有兜底，实际没有。
#   3) GitHub 官方也承认高负载时会 delay、队列满会 drop，公共仓库 60 天无活动还会自动禁用。
#   所以定时这件事交给 CF（Worker Cron 由调度器自己记账，可用 GraphQL analytics 核对），
#   GitHub 这边只保留 workflow_dispatch 作为「被调用」和「手动补跑」的入口。
#
# 时间（v4，2026-11-11）：CF 侧两条 cron 表达式，共占 2 个槽位（免费版每账号 5 条）
#   `*/10 7 * * 1-5`   → 北京 15:00–15:50 每 10 分钟，收盘窗口内尽早拿到当天数据
#   `0 8 * * 1-5`      → 北京 16:00 兜底（用户口径：正常 16 点应已清算/生成完毕）
#   Worker 侧还有「宽度 + 上证日K都同日」的发布闸门；两个文件缺一个都继续触发。
#   workflow 第一步是轻量就绪探针（只请求 1 次上证日K），当天日K没补上就几秒退出，
#   不会白跑全量 5580 只 —— 所以高频触发几乎不消耗 runner 时间。
#   脚本内部一律用固定 UTC+8 北京时间（容器是 UTC，不能依赖 localtime）；
#   数据已是今日完整版时直接跳过，幂等保护防止重复抓。

on:
  workflow_dispatch:             # 唯一入口：CF Worker Cron 调用 / 手动验证与补跑
    inputs:
      limit:
        description: '只跑前 N 只（连通性自测用，留空 = 全量）'
        required: false
        default: ''
      no_wait:
        description: '跳过「等收盘数据就绪」直接跑（补跑历史用）'
        type: boolean
        default: false
      since:
        description: '补历史起点 YYYYMMDD（如 19900101；填了则全量补抓并提交）'
        required: false
        default: ''

permissions:
  contents: write                # 需要把 JSON 提交回仓库

concurrency:
  group: breadth
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      # 轻量就绪探针：高频触发时，当天日K还没补上就别白跑 5580 只股票。
      # 只发 1 个请求（上证指数最近 3 根日K），几秒结束；探针失败一律放行，
      # 绝不因为探针本身出问题而漏跑（真正的 wait_ready 在脚本里还有一层）。
      - name: 收盘数据就绪探针
        id: probe
        if: inputs.limit == '' && inputs.since == ''
        run: |
          python3 - <<'PY'
          import json, os, urllib.request
          from datetime import datetime, timedelta, timezone
          BJ = timezone(timedelta(hours=8))
          today = datetime.now(BJ).strftime('%Y-%m-%d')
          url = ('https://push2his.eastmoney.com/api/qt/stock/kline/get'
                 '?secid=1.000001&klt=101&fqt=1&lmt=3&end=20500101'
                 '&fields1=f1,f2,f3,f4,f5,f6&fields2=f51,f52,f53,f54,f55,f56,f57')
          ready = 'true'
          try:
              # 周末本来就无当日日K，交给脚本自己的 wait_ready 口径处理，探针不拦截
              if datetime.now(BJ).weekday() >= 5:
                  print('周末，探针放行')
                  raise SystemExit
              req = urllib.request.Request(url, headers={'User-Agent': 'Mozilla/5.0'})
              with urllib.request.urlopen(req, timeout=12) as r:
                  d = json.load(r)
              bars = (d.get('data') or {}).get('klines') or []
              last = bars[-1].split(',')[0] if bars else ''
              print('上证最新日K =', last, '| 北京今天 =', today)
              ready = 'true' if last == today else 'false'
          except SystemExit:
              pass
          except Exception as e:
              print('探针异常，放行跑批：', e)
              ready = 'true'
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write('ready=' + ready + '\n')
          PY
        # 探针未就绪时不算失败，整条工作流以「成功但跳过」收尾，避免刷失败通知
      - name: 跳过说明
        if: steps.probe.outputs.ready == 'false'
        run: echo "::notice::当天上证日K尚未就绪，本次跳过（等待下一次触发）"

      - uses: actions/checkout@v4
        if: steps.probe.outputs.ready != 'false'

      - uses: actions/setup-python@v5
        if: steps.probe.outputs.ready != 'false'
        with:
          python-version: '3.11'
          cache: pip

      - name: 安装依赖
        if: steps.probe.outputs.ready != 'false'
        run: pip install -r requirements.txt

      - name: 跑批
        if: steps.probe.outputs.ready != 'false'
        env:
          LIMIT: ${{ inputs.limit }}
          NO_WAIT: ${{ inputs.no_wait }}
          SINCE: ${{ inputs.since }}
        run: |
          set -euo pipefail
          ARGS="--out breadth/data/breadth.json"
          if [ -n "${SINCE:-}" ]; then ARGS="$ARGS --fresh --since $SINCE"; fi
          if [ -n "${LIMIT:-}" ]; then ARGS="$ARGS --limit $LIMIT --fresh"; fi
          # 默认（无 since / limit）：增量模式 —— 只抓最近 80 根日K做指标暖机，
          # 追加新交易日到既有数据；跑批从「全量 170s」降到「~40s」，
          # 历史 8816 个交易日完整保留，不影响性能。
          if [ -z "${SINCE:-}" ] && [ -z "${LIMIT:-}" ]; then ARGS="$ARGS --incremental"; fi
          if [ "${NO_WAIT:-false}" = "true" ]; then ARGS="$ARGS --no-wait"; fi
          echo ">>> python tools/breadth_run.py $ARGS"
          python tools/breadth_run.py $ARGS

      - name: 提交数据
        # 手动跑 limit 小样本（连通性自测）时绝不提交，否则会用 50 只的假数据覆盖全量结果
        # 探针判定「当天日K未就绪」时也不提交（此时 checkout 都跳过了，没有数据文件）
        if: success() && steps.probe.outputs.ready != 'false' && (github.event_name != 'workflow_dispatch' || inputs.limit == '')
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          d = json.load(open('breadth/data/breadth.json', encoding='utf-8'))
          u = d['meta']['universe']; n = len(d['dates'])
          m = d['meta']
          print('股票池 %d 只 / 交易日 %d 个 / 末日 %s / 生成 %s' %
                (u, n, m.get('to'), m.get('generated')))
          if u < 5000 or n < 700:
              raise SystemExit('数据异常（股票池或交易日过少），拒绝提交')
          if not m.get('generated_tz') or not m.get('trade_date'):
              raise SystemExit('meta 缺时区/交易日字段，疑似旧版脚本，拒绝提交')
          # v276：宽度与上证 K 线必须同日成对，防止“insum 新 / 上证旧”
          s = json.load(open('breadth/data/sse.json', encoding='utf-8'))
          if s['meta']['to'] != m['trade_date']:
              raise SystemExit('sse.json 末日 %s != breadth 交易日 %s，拒绝提交' %
                               (s['meta']['to'], m['trade_date']))
          print('上证日K %d 根 / 末日 %s（与 breadth 同日）' % (len(s['dates']), s['meta']['to']))
          PY
          git config user.name  "breadth-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- breadth/data/breadth.json breadth/data/sse.json; then
            echo "数据无变化，跳过提交"
          else
            git add breadth/data/breadth.json breadth/data/sse.json
            git commit -m "data: $(TZ=Asia/Shanghai date +%Y-%m-%d) 市场宽度+上证日K"
            git push
          fi

      - name: 刷新 jsDelivr CDN 缓存
        # jsDelivr 的 @main 默认 12 小时缓存，不刷新的话当天收盘数据要晚半天才可见。
        # purge 是公开的免费接口（实测 status=finished / throttled=false），
        # 一天一次不会触发限流；失败也不影响 raw 源，宽度页有竞速兜底。
        if: success() && steps.probe.outputs.ready != 'false' && (github.event_name != 'workflow_dispatch' || inputs.limit == '')
        run: |
          curl -fsS --max-time 20 \
            "https://purge.jsdelivr.net/gh/chrisliu1116-y/insum-cloud@main/breadth/data/breadth.json" \
            || echo "::warning::jsDelivr purge 失败（raw 源仍可正常读取）"
          curl -fsS --max-time 20 \
            "https://purge.jsdelivr.net/gh/chrisliu1116-y/insum-cloud@main/breadth/data/sse.json" \
            || echo "::warning::jsDelivr sse.json purge 失败（raw 源仍可正常读取）"

      # 跑批失败时把关键信息贴到日志末尾，方便一眼看出是「东财连不上」还是「数据没就绪」
      - name: 失败诊断
        if: failure()
        run: |
          echo "::warning::跑批失败。常见原因：① 东财对 GitHub 机房 IP 限流；② 收盘数据尚未就绪（脚本等 45 分钟仍没等到）。"
