name: 代理出口实战验证（临时代理跑批·不提交数据）

# 2026-11-18 临时验证 workflow：GitHub Actions 沙盒内起 mihomo，
# 从 SUB_URL(Secrets) 拉机场订阅，过滤中国香港/中国台湾/新加坡节点，
# 用 load-balance 分摊，经 127.0.0.1:7890 代理跑【纯东财全量】。
# 目的：验证机场节点出口 IP 能否绕开东财对 Azure/CF 机房 IP 的限流。
# 安全约束：
#   ① 订阅只从 Secrets 读，绝不 echo 到日志（GitHub 也会自动 mask）；
#   ② 连通性验证只请求 cp.cloudflare.com，零东财；
#   ③ 实战 5 分钟硬闸（timeout 300），到点即杀；
#   ④ 本 workflow 无任何「提交数据」步骤，绝不用验证数据覆盖线上 breadth/sse；
#   ⑤ 跑批结束 if: always() 销毁 mihomo 进程与临时文件。

on:
  workflow_dispatch:

permissions:
  contents: read          # 只需读仓库，不写

jobs:
  proxy-live:
    runs-on: ubuntu-latest
    timeout-minutes: 10   # 平台级兜底（下载~1min + 连通~1min + 实战5min 留余量）

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: 安装跑批依赖
        run: pip install -r requirements.txt pyyaml

      - name: 校验 SUB_URLS 已配置（不打印值）
        env:
          SUB_URLS: ${{ secrets.SUB_URLS }}
        run: |
          N="$(printf '%s\n' "${SUB_URLS:-}" | grep -c '^https\?://' || true)"
          if [ "${N:-0}" -lt 1 ]; then
            echo "::error::SUB_URLS secret 未配置或格式不对（需每行一个 http(s) 订阅链接），终止"
            exit 1
          fi
          echo "SUB_URLS 已配置：$N 个订阅链接，值不打印"

      - name: 下载 mihomo 内核
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # 带 github.token 调 API（认证后不受匿名限流），取最新 release 的 amd64 gz 资产
          URL="$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/MetaCubeX/mihomo/releases/latest \
            | python3 -c 'import sys,json; d=json.load(sys.stdin); \
              a=[x["browser_download_url"] for x in d["assets"] \
                 if "linux-amd64" in x["name"] and "compatible" not in x["name"] \
                 and x["name"].endswith(".gz")]; \
              a=a or [x["browser_download_url"] for x in d["assets"] \
                 if "linux-amd64-compatible" in x["name"] and x["name"].endswith(".gz")]; \
              print(a[0] if a else "")')"
          if [ -z "$URL" ]; then
            echo "::error::无法获取 mihomo 下载地址"
            exit 1
          fi
          echo "下载 mihomo: ${URL##*/}"
          curl -fsSL "$URL" | gunzip > /tmp/mihomo && chmod +x /tmp/mihomo
          /tmp/mihomo -v 2>&1 | head -1 || true

      - name: 拉订阅并转换为 proxies（本地解析，不外发、不打印订阅内容）
        env:
          SUB_URLS: ${{ secrets.SUB_URLS }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/mihomo-conf /tmp/subs
          # 逐个订阅拉取 -> 本地解析成 Clash proxies（订阅地址只作 curl 参数，不 echo）
          i=0
          while IFS= read -r url; do
            url="$(printf '%s' "$url" | tr -d '\r' | xargs || true)"
            case "$url" in http://*|https://*) ;; *) continue ;; esac
            i=$((i+1))
            echo "拉取订阅 #$i ..."
            curl -fsSL --max-time 60 \
              -H 'User-Agent: Clash/v1.18.0' \
              "$url" -o "/tmp/subs/raw_$i.txt" || { echo "::warning::订阅 #$i 拉取失败，跳过"; continue; }
            # 只打印格式特征，不打印订阅内容或节点凭据
            python3 -c "
          import sys,base64,re
          t=open('/tmp/subs/raw_$i.txt',encoding='utf-8',errors='replace').read().strip()
          info='订阅 #$i: 字节=%d' % len(t)
          if t.startswith('proxies:') or 'proxies:' in t[:500]:
            info+=' 格式=Clash-YAML'
          else:
            try:
              d=base64.b64decode(t+'='*(-len(t)%4)).decode('utf-8','replace')
              first=next((l for l in d.splitlines() if l.strip()),'')
              pref=re.match(r'([a-z0-9]+)://',first.lower())
              info+=' 格式=Base64 解码首行协议=%s' % (pref.group(1) if pref else first[:20])
            except Exception as e:
              info+=' 格式=未知(%s)' % str(e)[:40]
          print(info)
          "
            python3 tools/sub_to_clash.py "/tmp/subs/raw_$i.txt" "/tmp/subs/proxies_$i.yaml"
          done <<< "${SUB_URLS}"
          echo "共拉取 $i 个订阅"
          # 合并所有 proxies_*.yaml 为一个 proxies.yaml
          python3 - <<'PY'
          import glob, yaml, os
          proxies=[]
          seen=set()
          for f in sorted(glob.glob('/tmp/subs/proxies_*.yaml')):
              d=yaml.safe_load(open(f,encoding='utf-8')) or {}
              for p in (d.get('proxies') or []):
                  n=p.get('name')
                  if n and n not in seen:
                      seen.add(n); proxies.append(p)
          # 写出合并后的 proxies 段
          import sys
          sys.path.insert(0,'tools')
          from sub_to_clash import to_yaml
          open('/tmp/subs/proxies_all.yaml','w',encoding='utf-8').write(to_yaml(proxies))
          print('合并后唯一节点数:',len(proxies))
          if len(proxies)<3:
              print('::error::解析出的节点不足 3 个，订阅格式可能不支持')
              sys.exit(1)
          PY
          # 拼装最终 config.yaml：proxies + 本地 filter 组 + 规则
          cat > /tmp/mihomo-conf/config.yaml <<'EOF'
          mixed-port: 7890
          allow-lan: false
          mode: rule
          log-level: warning
          external-controller: 127.0.0.1:9090
          health-check:
            enable: true
            interval: 300
            url: https://cp.cloudflare.com/generate_204
          proxy-groups:
            - name: "auto"
              type: load-balance
              filter: "(?i)(香港|HK|台湾|TW|新加坡|SG|Hong Kong|Taiwan|Singapore)"
              url: https://cp.cloudflare.com/generate_204
              interval: 300
              strategy: round-robin
          rules:
            - MATCH,auto
          EOF
          # 把 proxies 段插到 config.yaml 顶部
          python3 - <<'PY'
          cfg=open('/tmp/mihomo-conf/config.yaml',encoding='utf-8').read()
          proxies=open('/tmp/subs/proxies_all.yaml',encoding='utf-8').read()
          # proxies 段统一缩进 0（都是顶层），直接拼在 health-check 之前也可；放最前最稳
          combo=proxies.rstrip()+'\n\n'+cfg
          open('/tmp/mihomo-conf/config.yaml','w',encoding='utf-8').write(combo)
          print('config.yaml 已生成（proxies 内嵌，内容不打印）')
          PY
          # 校验配置能被 mihomo 解析（下面启动步骤会实际加载）

      - name: 启动 mihomo 并验证连通性（零东财请求）
        run: |
          set -euo pipefail
          /tmp/mihomo -d /tmp/mihomo-conf > /tmp/mihomo.log 2>&1 &
          echo $! > /tmp/mihomo.pid
          # 等订阅拉取 + 节点健康检查
          OK=0
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w "%{http_code}" -x http://127.0.0.1:7890 \
                     --max-time 10 https://cp.cloudflare.com/generate_204 || true)
            if [ "$code" = "204" ]; then OK=1; break; fi
            sleep 2
          done
          if [ "$OK" != "1" ]; then
            echo "::error::代理连通失败（30 次尝试均未拿到 204）"
            echo "--- mihomo.log 末尾 ---"; tail -30 /tmp/mihomo.log || true
            exit 1
          fi
          echo "代理连通 OK（经 7890 拿到 204）"
          # 过滤后节点数（auto 组 all = filter 命中的内嵌节点；只看名字，不含订阅地址）
          echo "--- 过滤后(港台新)节点 ---"
          COUNT="$(curl -s http://127.0.0.1:9090/proxies/auto \
            | python3 -c "import sys,json; d=json.load(sys.stdin); a=d.get('all',[]); \
              print('过滤后节点数:',len(a)); print('节点:',a[:20]); print('COUNT='+str(len(a)),file=sys.stderr)" \
            2>/tmp/node_count.txt | head -2)"
          COUNT="$(grep -oP 'COUNT=\K\d+' /tmp/node_count.txt || echo 0)"
          echo "$COUNT 个港台新节点通过过滤"
          if [ "$COUNT" -lt 3 ]; then
            echo "::error::过滤后港台新节点数 $COUNT < 3，订阅未正确加载"
            echo "--- mihomo.log 末尾 ---"; tail -40 /tmp/mihomo.log || true
            exit 1
          fi
          echo "港台新节点 $COUNT 个，连通性与节点过滤均通过"

      - name: 【实战】纯东财全量（注入代理，5分钟硬闸，不提交）
        env:
          BREADTH_SOURCE: eastmoney      # 强制纯东财源（默认 tencent 会被护栏挡）
          HTTP_PROXY: http://127.0.0.1:7890
          HTTPS_PROXY: http://127.0.0.1:7890
        run: |
          set -uo pipefail
          # 用东财历史底稿作为增量起点（避开两源混拼护栏，且保留 8818 日历史）
          cp breadth/data/_archive_breadth_em_20261114.json breadth/data/breadth.json
          echo "起点：东财底稿 8818 日 / 5584 只 / 末日 2026-11-12"
          echo "启动全量实战：4 并发 / 80 根增量 / 5 分钟硬闸（timeout 300）"
          set +e
          timeout 300 python tools/breadth_run.py --out breadth/data/breadth.json --incremental
          RC=$?
          set -e
          echo ">>> 实战退出码: $RC （124=5分钟硬闸到点强杀）"
          if [ "$RC" = "124" ]; then
            echo "::warning::实战超过 5 分钟被掐断——按用户口径，超时即判定有问题"
          fi
          # 打印结果摘要（供日志判定，不提交）
          python3 - <<'PY'
          import json
          try:
            d=json.load(open('breadth/data/breadth.json',encoding='utf-8'))
            m=d.get('meta',{})
            print('实战结果: universe=%s 交易日=%s 末日=%s valid=%s stale=%s reason=%s'%(
              m.get('universe'),len(d.get('dates',[])),d.get('dates',[-1])[-1] if d.get('dates') else None,
              m.get('valid'),m.get('stale'),m.get('stale_reason')))
          except Exception as e:
            print('结果读取失败:',e)
          PY
          echo "本 workflow 不提交任何数据，线上 breadth/sse 不受影响"

      - name: 清理 mihomo（always）
        if: always()
        run: |
          if [ -f /tmp/mihomo.pid ]; then
            kill "$(cat /tmp/mihomo.pid)" 2>/dev/null || true
          fi
          pkill -f '/tmp/mihomo' 2>/dev/null || true
          rm -f /tmp/mihomo /tmp/mihomo.log /tmp/mihomo.pid
          find /tmp/mihomo-conf -type f -delete 2>/dev/null || true
          echo "mihomo 进程与临时文件已清理"
