name: 机场代理东财全量跑批（正式）

# 2026-11-18 正式 workflow（验证已成功：5585只/失败0/52req/s/107s）：
# GitHub Actions 沙盒内起 mihomo，从 SUB_URLS(Secrets) 拉 3 个机场订阅，
# 本地解析聚合亚太节点，load-balance 分摊，30 并发经 127.0.0.1:7890
# 代理跑【纯东财全量】，成功后提交 breadth/sse 更新线上数据。
# 安全约束：
#   ① 订阅只从 Secrets 读，日志只打印节点数/UA/HTTP码，绝不打印链接内容（GitHub 也自动 mask）；
#   ② probe_only=true 时只做订阅解析自检（零东财、不跑批、不提交），确认 3 源都出节点；
#   ③ 连通性验证只请求 cp.cloudflare.com，零东财；
#   ④ 实战 10 分钟硬闸 + 30 并发 + 异常降速保底；
#   ⑤ 提交前多重护栏（universe/交易日/sse同日），异常一律拒绝提交，不用坏数据覆盖线上；
#   ⑥ 跑批结束 if: always() 销毁 mihomo 进程与临时文件。

on:
  workflow_dispatch:
    inputs:
      probe_only:
        description: '自检模式：只拉3个订阅解析出节点数，不跑批不提交（正式跑前验证用）'
        type: boolean
        default: false

permissions:
  contents: write         # 正式跑需提交 breadth/sse/runlog

jobs:
  proxy-live:
    runs-on: ubuntu-latest
    timeout-minutes: 13   # 平台级兜底（下载~1min + 连通~1min + 实战10min + 余量）

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: 安装跑批依赖
        run: pip install -r requirements.txt pyyaml

      - name: 校验 SUB_URLS 已配置（不打印值）
        env:
          SUB_URLS: ${{ secrets.SUB_URLS }}
        run: |
          N="$(printf '%s\n' "${SUB_URLS:-}" | grep -c '^https\?://' || true)"
          if [ "${N:-0}" -lt 1 ]; then
            echo "::error::SUB_URLS secret 未配置或格式不对（需每行一个 http(s) 订阅链接），终止"
            exit 1
          fi
          echo "SUB_URLS 已配置：$N 个订阅链接，值不打印"

      - name: 下载 mihomo 内核
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # 带 github.token 调 API（认证后不受匿名限流），取最新 release 的 amd64 gz 资产
          URL="$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/MetaCubeX/mihomo/releases/latest \
            | python3 -c 'import sys,json; d=json.load(sys.stdin); \
              a=[x["browser_download_url"] for x in d["assets"] \
                 if "linux-amd64" in x["name"] and "compatible" not in x["name"] \
                 and x["name"].endswith(".gz")]; \
              a=a or [x["browser_download_url"] for x in d["assets"] \
                 if "linux-amd64-compatible" in x["name"] and x["name"].endswith(".gz")]; \
              print(a[0] if a else "")')"
          if [ -z "$URL" ]; then
            echo "::error::无法获取 mihomo 下载地址"
            exit 1
          fi
          echo "下载 mihomo: ${URL##*/}"
          curl -fsSL "$URL" | gunzip > /tmp/mihomo && chmod +x /tmp/mihomo
          /tmp/mihomo -v 2>&1 | head -1 || true

      - name: 拉订阅并转换为 proxies（本地解析，不外发、不打印订阅内容）
        env:
          SUB_URLS: ${{ secrets.SUB_URLS }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/mihomo-conf /tmp/subs
          # 逐个订阅拉取 -> 本地解析成 Clash proxies（订阅地址只作 curl 参数，不 echo）
          i=0
          while IFS= read -r url; do
            url="$(printf '%s' "$url" | tr -d '\r' | xargs || true)"
            case "$url" in http://*|https://*) ;; *) continue ;; esac
            i=$((i+1))
            echo "拉取订阅 #$i ..."
            # UA 轮换：不同机场对被屏蔽的 UA 反应不同，逐个尝试直到拿到非空响应
            got=0
            for ua in 'Clash/v1.18.0' 'Clash-verge/v1.6.0' 'mihomo/1.19.0' \
                      'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/122.0 Safari/537.36'; do
              code="$(curl -sSL --max-time 60 -A "$ua" -w '%{http_code}' \
                        "$url" -o "/tmp/subs/raw_$i.txt" || echo 000)"
              sz="$(wc -c < "/tmp/subs/raw_$i.txt" 2>/dev/null || echo 0)"
              echo "  UA=${ua%%/*} HTTP=$code 字节=$sz"
              if [ "$code" = "200" ] && [ "${sz:-0}" -gt 100 ]; then got=1; break; fi
            done
            if [ "$got" != "1" ]; then echo "::warning::订阅 #$i 所有 UA 均失败，跳过"; continue; fi
            # 只打印结构特征矩阵（布尔/计数），绝不打印订阅内容或节点凭据
            python3 -c "
          import sys,re
          sys.path.insert(0,'tools')
          from sub_to_clash import deep_decode
          b=open('/tmp/subs/raw_$i.txt','rb').read()
          d=deep_decode(b)
          feat=[]
          feat.append('原始%d字%d'%(len(b),len(d)))
          feat.append('gzip魔数=%s'%(b[:2]==b'\x1f\x8b'))
          feat.append('proxies段=%s'%('proxies:' in d))
          feat.append('YAML节点项=%s'%bool(re.search(r'(?m)^\s*-\s*name:',d)))
          for proto in ['ss','vmess','vless','trojan','hysteria2']:
            feat.append('%s=%d'%(proto,d.lower().count(proto+'://')))
          feat.append('html=%s'%bool(re.search(r'<(html|!doctype|body)',d[:500],re.I)))
          feat.append('换行=%d'%d.count(chr(10)))
          print('订阅 #$i 特征: '+' '.join(feat))
          "
            python3 tools/sub_to_clash.py "/tmp/subs/raw_$i.txt" "/tmp/subs/proxies_$i.yaml"
          done <<< "${SUB_URLS}"
          echo "共拉取 $i 个订阅"
          # 逐源统计 + 合并所有 proxies_*.yaml（只打印数量，不打印节点/链接）
          python3 - <<'PY'
          import glob, yaml, os, sys
          sys.path.insert(0,'tools')
          from node_filter import is_apac, EXCLUDE_RE
          proxies=[]
          seen=set()
          files=sorted(glob.glob('/tmp/subs/proxies_*.yaml'))
          print('=== 各订阅解析结果（仅数量）===')
          for f in files:
              d=yaml.safe_load(open(f,encoding='utf-8')) or {}
              ps=[p for p in (d.get('proxies') or []) if p.get('name') and not EXCLUDE_RE.search(p['name'])]
              geo=sum(1 for p in ps if is_apac(p.get('name')))
              idx=os.path.basename(f).replace('proxies_','').replace('.yaml','')
              print('  订阅 #%s: 有效节点 %d 个，其中亚太 %d 个' % (idx,len(ps),geo))
          for f in files:
              d=yaml.safe_load(open(f,encoding='utf-8')) or {}
              for p in (d.get('proxies') or []):
                  n=p.get('name')
                  if n and n not in seen and not EXCLUDE_RE.search(n):
                      seen.add(n); proxies.append(p)
          from sub_to_clash import to_yaml
          open('/tmp/subs/proxies_all.yaml','w',encoding='utf-8').write(to_yaml(proxies))
          print('合并后唯一有效节点数:',len(proxies))
          if len(proxies)<3:
              print('::error::解析出的节点不足 3 个，订阅格式可能不支持')
              sys.exit(1)
          PY
          # 自检模式：只解析、不跑批、不提交
          if [ "${{ inputs.probe_only }}" = "true" ]; then
            echo "=== 自检模式完成：3 源解析已验证，不跑批不提交 ==="
            exit 0
          fi
          # 拼装最终 config.yaml：内嵌 proxies + 亚太节点显式列表组 + 规则
          # 注意：mihomo 的 load-balance 组用 filter 时必须配 use(provider)，
          # 对内嵌 proxies 不能直接用 filter（报 "use or proxies missing"），
          # 所以这里按正则筛出节点名，显式写进 proxies 列表。
          python3 - <<'PY'
          import yaml, sys
          sys.path.insert(0,'tools')
          from node_filter import is_apac
          d=yaml.safe_load(open('/tmp/subs/proxies_all.yaml',encoding='utf-8')) or {}
          proxies=d.get('proxies') or []
          picked=[p['name'] for p in proxies if is_apac(p.get('name'))]
          if len(picked)<3:
              picked=[p['name'] for p in proxies]   # 兜底：亚太不足就用全部有效节点
          print('auto 组节点数:',len(picked),'（从',len(proxies),'个有效节点中筛出）')
          from sub_to_clash import to_yaml, _scalar
          lines=[to_yaml(proxies).rstrip(), '',
            'mixed-port: 7890','allow-lan: false','mode: rule','log-level: warning',
            'external-controller: 127.0.0.1:9090','',
            'proxy-groups:','  - name: "auto"','    type: load-balance','    proxies:']
          for n in picked:
              lines.append('      - %s' % _scalar(n))
          lines += ['    url: https://cp.cloudflare.com/generate_204',
                    '    interval: 300','    strategy: round-robin','',
                    'rules:','  - MATCH,auto','']
          open('/tmp/mihomo-conf/config.yaml','w',encoding='utf-8').write('\n'.join(lines))
          print('config.yaml 已生成（auto 组显式列出',len(picked),'个节点）')
          # 生成后用 PyYAML 自检语法，避免再次到 mihomo 才报错
          chk=yaml.safe_load(open('/tmp/mihomo-conf/config.yaml',encoding='utf-8'))
          assert chk.get('proxies') and chk.get('proxy-groups')
          print('配置自检通过: proxies=%d 组=%d' % (len(chk['proxies']),len(chk['proxy-groups'])))
          PY

      - name: 启动 mihomo 并验证连通性（零东财请求）
        if: inputs.probe_only != true
        run: |
          set -euo pipefail
          /tmp/mihomo -d /tmp/mihomo-conf > /tmp/mihomo.log 2>&1 &
          echo $! > /tmp/mihomo.pid
          # 等订阅拉取 + 节点健康检查
          OK=0
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w "%{http_code}" -x http://127.0.0.1:7890 \
                     --max-time 10 https://cp.cloudflare.com/generate_204 || true)
            if [ "$code" = "204" ]; then OK=1; break; fi
            sleep 2
          done
          if [ "$OK" != "1" ]; then
            echo "::error::代理连通失败（30 次尝试均未拿到 204）"
            echo "--- mihomo.log 末尾 ---"; tail -30 /tmp/mihomo.log || true
            exit 1
          fi
          echo "代理连通 OK（经 7890 拿到 204）"
          # 过滤后节点数（auto 组 all = filter 命中的内嵌节点；只看名字，不含订阅地址）
          echo "--- 过滤后(亚太)节点 ---"
          COUNT="$(curl -s http://127.0.0.1:9090/proxies/auto \
            | python3 -c "import sys,json; d=json.load(sys.stdin); a=d.get('all',[]); \
              print('过滤后节点数:',len(a)); print('节点:',a[:20]); print('COUNT='+str(len(a)),file=sys.stderr)" \
            2>/tmp/node_count.txt | head -2)"
          COUNT="$(grep -oP 'COUNT=\K\d+' /tmp/node_count.txt || echo 0)"
          echo "$COUNT 个亚太节点通过过滤"
          if [ "$COUNT" -lt 3 ]; then
            echo "::error::过滤后亚太节点数 $COUNT < 3，订阅未正确加载"
            echo "--- mihomo.log 末尾 ---"; tail -40 /tmp/mihomo.log || true
            exit 1
          fi
          echo "亚太节点 $COUNT 个，连通性与节点过滤均通过"

      - name: 【实战】纯东财全量（注入代理，30并发/10分钟硬闸）
        if: inputs.probe_only != true
        env:
          BREADTH_SOURCE: eastmoney      # 强制纯东财源（默认 tencent 会被护栏挡）
          BREADTH_WORKERS: '30'          # 激进并发：48 节点 load-balance 分摊，单节点请求少
          HTTP_PROXY: http://127.0.0.1:7890
          HTTPS_PROXY: http://127.0.0.1:7890
        run: |
          set -uo pipefail
          # 用东财历史底稿作为增量起点（避开两源混拼护栏，且保留 8818 日历史）
          cp breadth/data/_archive_breadth_em_20261114.json breadth/data/breadth.json
          echo "起点：东财底稿 8818 日 / 5584 只 / 末日 2026-11-12"
          echo "启动全量实战：30 并发 / 80 根增量 / 10 分钟硬闸（timeout 600）"
          set +e
          timeout 600 python tools/breadth_run.py --out breadth/data/breadth.json --incremental
          RC=$?
          set -e
          echo ">>> 实战退出码: $RC （124=10分钟硬闸到点强杀）"
          if [ "$RC" = "124" ]; then
            echo "::warning::实战超过 10 分钟被掐断"
          fi
          # 打印结果摘要（供日志判定，不提交）
          python3 - <<'PY'
          import json
          try:
            d=json.load(open('breadth/data/breadth.json',encoding='utf-8'))
            m=d.get('meta',{})
            print('实战结果: universe=%s 交易日=%s 末日=%s valid=%s stale=%s reason=%s'%(
              m.get('universe'),len(d.get('dates',[])),d.get('dates',[-1])[-1] if d.get('dates') else None,
              m.get('valid'),m.get('stale'),m.get('stale_reason')))
          except Exception as e:
            print('结果读取失败:',e)
          PY
          echo "实战完成，进入数据提交步骤"

      - name: 提交数据（带护栏，异常拒绝覆盖线上）
        if: inputs.probe_only != true
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          d=json.load(open('breadth/data/breadth.json',encoding='utf-8'))
          m=d.get('meta',{})
          u=m.get('universe'); n=len(d.get('dates',[]))
          print('待提交: universe=%s 交易日=%s 末日=%s stale=%s reason=%s'%(
            u,n,d.get('dates',[None])[-1],m.get('stale'),m.get('stale_reason')))
          # 护栏1：股票池/交易日数量
          if not u or u<5000 or n<700:
              raise SystemExit('拒绝提交：股票池或交易日过少')
          # 护栏2：stale 标记（风控异常）
          if m.get('stale'):
              raise SystemExit('拒绝提交：meta.stale=%s reason=%s'%(m['stale'],m.get('stale_reason')))
          # 护栏3：时区/交易日字段
          if not m.get('generated_tz') or not m.get('trade_date'):
              raise SystemExit('拒绝提交：meta 缺时区/交易日')
          # 护栏4：sse 与 breadth 同日
          s=json.load(open('breadth/data/sse.json',encoding='utf-8'))
          if s['meta'].get('to')!=m.get('trade_date'):
              raise SystemExit('拒绝提交：sse末日 %s != breadth交易日 %s'%(s['meta'].get('to'),m.get('trade_date')))
          print('护栏全部通过：数据完整且同日')
          PY
          git config user.name "breadth-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -z "$(git status --porcelain -- breadth/data/breadth.json breadth/data/sse.json)" ]; then
            echo "数据无变化，跳过提交"
          else
            git add breadth/data/breadth.json breadth/data/sse.json
            git commit -m "data: 机场代理东财全量 $(TZ=Asia/Shanghai date +%Y-%m-%d) 市场宽度+上证日K"
            # 先 commit 再 pull --rebase（有本地提交时 rebase 才不会因 unstaged 失败）
            git pull --rebase origin main || { echo "::warning::rebase 冲突，保留本地提交"; }
            git push
            echo "已提交 breadth.json + sse.json 到 main"
          fi

      - name: 清理 mihomo（always）
        if: always()
        run: |
          if [ -f /tmp/mihomo.pid ]; then
            kill "$(cat /tmp/mihomo.pid)" 2>/dev/null || true
          fi
          pkill -f '/tmp/mihomo' 2>/dev/null || true
          rm -f /tmp/mihomo /tmp/mihomo.log /tmp/mihomo.pid
          find /tmp/mihomo-conf -type f -delete 2>/dev/null || true
          echo "mihomo 进程与临时文件已清理"
